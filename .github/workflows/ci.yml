name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Install pinned Node and cache package downloads
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Log tool versions
        run: |
          node --version
          pnpm --version
      - name: Clean install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Formatting, lint, types, tests and builds
        run: pnpm ci:quality
      - name: Reject tracked credentials and private backups
        run: pnpm security:check
      - name: Validate release checklist shape without inventing approval
        run: pnpm release:validate
      - name: Reproduce experimental Evolved diagnostics
        run: pnpm test:poker:evolved --verify docs/simulations/evolved-a-v1.json
      - name: Isolated restore, replay, migrations and rollback
        run: pnpm ci:recovery

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Install pinned Node and cache package downloads
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Log tool versions
        run: |
          node --version
          pnpm --version
      - name: Clean install without dependency build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit all dependencies (high and critical block merges)
        run: pnpm ci:audit
