openapi: 3.0.3
info:
  title: DeckForge API — implemented identity foundation and planned business contracts
  version: 0.2.0
  description: >-
    Health and the operations marked implemented are available; identity routes fail closed unless configured. Other business operations remain planned.
    Complete strict schemas, auth, limits and tests in each owning ticket before exposure.
    See docs/PROTOCOL.md; no real-money or NFT endpoints exist.
servers:
  - url: https://api.example.invalid/v1
paths:
  /health:
    get:
      operationId: getHealth
      x-implementation-status: implemented
      summary: Public process liveness; not database or dependency readiness
      servers:
        - url: http://localhost:3001
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [service, status]
                properties:
                  service: {type: string, enum: [deckforge-api]}
                  status: {type: string, enum: [ok]}
        '429':
          description: Public health rate limit exceeded
  /me:
    get:
      x-implementation-status: implemented
      summary: Current verified internal profile
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Safe profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/ApiError'}
  /catalog/series:
    get:
      x-implementation-status: implemented
      summary: Validated published catalog; draft/internal-preview artwork is excluded
      parameters:
        - {in: query, name: cursor, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 20, default: 10}}
      responses:
        '200':
          description: Public page without private rights-review references
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogList'}
        default: {$ref: '#/components/responses/ApiError'}
  /cards:
    get:
      x-implementation-status: implemented
      summary: Minimal owner-only active inventory; owner selectors are rejected
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: cursor, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Page of owned or locked card instances
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivateCards'}
        default: {$ref: '#/components/responses/ApiError'}
  /cards/starter:
    post:
      operationId: grantStarterDeck
      x-implementation-status: implemented
      summary: Exactly one free base deck per verified internal account
      description: >-
        Requires active bound identity/session and an eligible published approved series.
        No client-selected instance IDs, rarity, level or owner. Twenty attempts per user
        per minute per process plus the global IP limit. All successful retries return the
        original grant, including after catalog retirement or subsequent card changes.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seriesId, idempotencyKey]
              properties:
                seriesId: {type: string, format: uuid}
                idempotencyKey: {type: string, pattern: '^[A-Za-z0-9_-]{10,128}$'}
      responses:
        '200':
          description: Stable original grant receipt; current inventory is GET /cards
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StarterGrant'}
        default: {$ref: '#/components/responses/ApiError'}
  /cards/{cardId}/favorite:
    parameters:
      - {in: path, name: cardId, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: setCardFavorite
      x-implementation-status: implemented
      summary: Set an owner-only presentation preference without mutating inventory or history
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [favorite]
              properties:
                favorite: {type: boolean}
      responses:
        '200':
          description: Idempotent requested preference; concurrent opposite writes are last-commit-wins
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, favorite]
                properties:
                  instanceId: {type: string, format: uuid}
                  favorite: {type: boolean}
        default: {$ref: '#/components/responses/ApiError'}
  /cards/{cardId}/provenance:
    parameters:
      - {in: path, name: cardId, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getCardHistory
      x-implementation-status: implemented
      summary: Owner-only retained card history, including consumed and revoked instances
      description: Internal operator IDs, reason/source keys, lock tokens and raw snapshots are omitted.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: afterVersion, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Version-ordered safe provenance page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardHistory'}
        default: {$ref: '#/components/responses/ApiError'}
  /loadouts/current:
    get:
      operationId: getCurrentLoadout
      x-implementation-status: implemented
      summary: Read the owner's primary selection and current eligibility; no automatic repair
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Null or current primary loadout with revalidated card status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentLoadout'}
        default: {$ref: '#/components/responses/ApiError'}
  /loadouts/{loadoutId}:
    parameters:
      - {in: path, name: loadoutId, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: saveLoadout
      x-implementation-status: implemented
      summary: Save one owned available card for every canonical face
      description: Version zero creates the primary selection; locks and versions serialize writes. This does not admit a match or deal cards.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoadoutCommand'}
      responses:
        '200':
          description: Stable selection receipt; replay does not overwrite a newer selection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoadoutSaved'}
        default: {$ref: '#/components/responses/ApiError'}
  /collection/archive:
    get:
      operationId: getOwnerArchive
      x-implementation-status: implemented
      summary: Owner-only retained instances, including consumed and revoked records
      description: No owner selectors, raw audit fields or inferred fusion lineage. Missing legacy origin and edition serial remain null.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: cursor, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: view, schema: {type: string, enum: [all, current, former], default: all}}
        - {in: query, name: seriesId, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: UUID-keyset page of recorded owner instances
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArchivePage'}
        default: {$ref: '#/components/responses/ApiError'}
  /collection/album:
    get:
      operationId: getOwnerAlbum
      x-implementation-status: implemented
      summary: Distinct-face series counts over the owner's entire retained archive
      description: Recorded counts include terminal records and do not grant discoveries, achievements or rewards. Current counts include OWNED and LOCKED only.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: cursor, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 20, default: 10}}
      responses:
        '200':
          description: Independent series page; counts are independent of archive pagination
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumPage'}
        default: {$ref: '#/components/responses/ApiError'}
  /collection/manager:
    get:
      operationId: getCollectionManager
      x-implementation-status: implemented
      summary: Owner display references plus uncapped active-inventory count
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: At most 100 references; unmanaged cards remain owned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerView'}
        default: {$ref: '#/components/responses/ApiError'}
    put:
      operationId: saveCollectionManager
      x-implementation-status: implemented
      summary: Replace display references without deleting card instances or history
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagerCommand'}
      responses:
        '200':
          description: Stable manager receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagerSaved'}
        default: {$ref: '#/components/responses/ApiError'}
  /evolutions/preview:
    post:
      x-implementation-status: planned
      summary: Non-mutating fusion eligibility preview
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FusionPreviewRequest'}
      responses:
        '200': {description: "Eligibility and prospective child details"}
        '409': {description: "One or more cards ineligible or locked"}
  /evolutions/confirm:
    post:
      x-implementation-status: planned
      summary: One-transaction five-instance fusion
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FusionConfirmRequest'}
      responses:
        '200': {description: "One unique fusion result; idempotent on retry"}
        '409': {description: "Cannot commit atomically or conflict"}
  /tournaments:
    get:
      x-implementation-status: planned
      summary: Published tournaments and eligibility
      responses:
        '200': {description: "Tournament list"}
  /commerce/verify:
    post:
      x-implementation-status: planned
      summary: Verify platform-signed receipt server-side
      security: [{bearerAuth: []}]
      responses:
        '202': {description: "Verification queued for authorized server-side processing"}
        '400': {description: "Unrecognized or invalid receipt"}
  /activity/sync:
    post:
      x-implementation-status: planned
      summary: Sync consented platform step records; canonical dedupe then allocate Trail Credits and Press progress once
      security: [{bearerAuth: []}]
      responses:
        '202': {description: "Reconciliation accepted; never trust submitted totals without source reconciliation"}
        '409': {description: "Stale or duplicated claim"}
  /wallets:
    get:
      x-implementation-status: planned
      summary: Separate Play Chips, earned Trail Credits and paid-only Store Gems
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Nontransferable currency balances"}
  /screens:
    get:
      x-implementation-status: planned
      summary: Published functional screen patterns priced only in earned Trail Credits
      responses:
        '200': {description: "Tier-eligible printing screens and prices"}
  /screens/{screenId}/buy:
    parameters:
      - in: path
        name: screenId
        required: true
        schema: {type: string, format: uuid}
    post:
      x-implementation-status: planned
      summary: Atomically debit earned Trail Credits and grant one screen entitlement
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "One newly owned screen entitlement or prior response on retry"}
  /press/jobs:
    post:
      x-implementation-status: planned
      summary: Lock eligible owned card and screen to a versioned walking-to-evolution recipe
      security: [{bearerAuth: []}]
      responses:
        '201': {description: "Press job created with fixed goal and target tier"}
        '409': {description: "Card, owned screen or concurrent active job ineligible"}
  /press/jobs/{jobId}/claim:
    parameters:
      - in: path
        name: jobId
        required: true
        schema: {type: string, format: uuid}
    post:
      x-implementation-status: planned
      summary: Atomically consume functional screen and ink and evolve SAME card instance
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Original instance ID with incremented state version and press provenance"}
        '409': {description: "Missing proof, outstanding steps or conflicting card lock"}
  /packs:
    get:
      x-implementation-status: planned
      summary: Catalog of earned random packs with versioned odds and paid fixed-content cosmetic packs
      responses:
        '200': {description: "Pack catalog with exact contents or earn-only published odds"}
  /packs/{packId}/open:
    parameters:
      - in: path
        name: packId
        required: true
        schema: {type: string, format: uuid}
    post:
      x-implementation-status: planned
      summary: Idempotent server-side pack fulfillment and earned-currency debit or validated IAP entitlement
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Immutable same opening result after retries"}
        '409': {description: "Insufficient earned currency, ineligible pack or unverified purchase"}
  /drops/nearby:
    get:
      x-implementation-status: planned
      summary: Active original safe location-category drops near consented foreground location
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Public drop metadata, without personal location history"}
  /drops/{dropId}/claim:
    parameters:
      - in: path
        name: dropId
        required: true
        schema: {type: string, format: uuid}
    post:
      x-implementation-status: planned
      summary: Validate fresh opt-in proximity, safe public access and one claim per cooldown
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Idempotent original collectible drop reward"}
        '409': {description: "Failed proof, ineligible location or cooldown"}
  /trails/nearby:
    get:
      x-implementation-status: planned
      summary: Admin-approved public trail routes and route-lap reward rules
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Safe route metadata and availability"}
  /trails/{trailId}/start:
    parameters:
      - in: path
        name: trailId
        required: true
        schema: {type: string, format: uuid}
    post:
      x-implementation-status: planned
      summary: Start opt-in foreground location session on an approved public route
      security: [{bearerAuth: []}]
      responses:
        '201': {description: "Created route session"}
  /trails/runs/{runId}/complete:
    parameters:
      - in: path
        name: runId
        required: true
        schema: {type: string, format: uuid}
    post:
      x-implementation-status: planned
      summary: Submit ordered-checkpoint session evidence for server verification
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Accepted lap and reward, same result on retry"}
        '202': {description: "Evidence queued for review"}
        '409': {description: "Spoof/replay/missing checkpoints/cooldown"}
  /auth/session:
    post:
      x-implementation-status: implemented
      summary: Bind a verified managed session to one internal user
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyCommand'}
      responses:
        '200':
          description: Safe operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/ApiError'}
  /auth/guest-link:
    post:
      x-implementation-status: implemented
      summary: Confirm same-user permanent identity without moving inventory
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GuestLink'}
      responses:
        '200':
          description: Safe operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/ApiError'}
  /auth/logout:
    post:
      x-implementation-status: implemented
      summary: Durably revoke this local session
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyCommand'}
      responses:
        '200':
          description: Safe operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogoutResult'}
        default: {$ref: '#/components/responses/ApiError'}
  /me/deletion-request:
    post:
      x-implementation-status: implemented
      summary: Queue deletion and suspend access; not a completed purge
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmptyCommand'}
      responses:
        '202':
          description: Safe operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionResult'}
        default: {$ref: '#/components/responses/ApiError'}
  /admin/access:
    get:
      x-implementation-status: implemented
      summary: Require local non-guest ADMIN plus verified aal2
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Safe operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAccess'}
        default: {$ref: '#/components/responses/ApiError'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    ApiError:
      description: Safe validation, identity, permission, conflict or availability error
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message, requestId]
                properties:
                  code: {type: string}
                  message: {type: string}
                  requestId: {type: string, format: uuid}
  schemas:
    PublicArt:
      type: object
      additionalProperties: false
      required: [id, key, sha256, width, height]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    CatalogList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        nextCursor: {type: string, format: uuid, nullable: true}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, slug, displayName, version, starterEligible, cards]
            properties:
              id: {type: string, format: uuid}
              slug: {type: string}
              displayName: {type: string}
              version: {type: integer, minimum: 1}
              starterEligible: {type: boolean}
              cards:
                type: array
                minItems: 52
                maxItems: 52
                items:
                  type: object
                  additionalProperties: false
                  required: [faceId, rarity, playStyleFamily, front, back]
                  properties:
                    faceId: {type: string, pattern: '^(?:[2-9]|10|J|Q|K|A)-[CDHS]$'}
                    rarity: {type: string, enum: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY]}
                    playStyleFamily: {type: string}
                    front: {$ref: '#/components/schemas/PublicArt'}
                    back: {$ref: '#/components/schemas/PublicArt'}
    StarterGrant:
      type: object
      additionalProperties: false
      required: [grantId, seriesId, manifestVersion, cards]
      properties:
        grantId: {type: string, format: uuid}
        seriesId: {type: string, format: uuid}
        manifestVersion: {type: integer, minimum: 1}
        cards:
          type: array
          minItems: 52
          maxItems: 52
          items:
            type: object
            additionalProperties: false
            required: [instanceId, faceId, level, branch, rarity, stateVersion]
            properties:
              instanceId: {type: string, format: uuid}
              faceId: {type: string, pattern: '^(?:[2-9]|10|J|Q|K|A)-[CDHS]$'}
              level: {type: integer, enum: [1]}
              branch: {type: string, enum: [BLUE]}
              rarity: {type: string, enum: [COMMON]}
              stateVersion: {type: integer, enum: [1]}
    CardHistory:
      type: object
      additionalProperties: false
      required: [instanceId, faceId, seriesId, editionSerial, originEventId, currentStatus, currentVersion, events, nextVersion]
      properties:
        instanceId: {type: string, format: uuid}
        faceId: {type: string, pattern: '^(?:[2-9]|10|J|Q|K|A)-[CDHS]$'}
        seriesId: {type: string, format: uuid}
        editionSerial: {type: integer, minimum: 1, nullable: true}
        originEventId: {type: string, format: uuid, nullable: true}
        currentStatus: {type: string, enum: [OWNED, LOCKED, CONSUMED, REVOKED]}
        currentVersion: {type: integer, minimum: 1}
        nextVersion: {type: integer, minimum: 1, nullable: true}
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [eventId, action, stateVersion, recordedAt, actor, state]
            properties:
              eventId: {type: string, format: uuid}
              action: {type: string, enum: [MINT, GRANT, FUSION_CONSUME, FUSION_CREATE, PRESS_EVOLVE, LOCK, UNLOCK, REVOKE]}
              stateVersion: {type: integer, minimum: 1}
              recordedAt: {type: string, format: date-time}
              actor: {type: string, enum: [SELF, OPERATOR, SYSTEM, UNKNOWN]}
              state:
                type: object
                nullable: true
                additionalProperties: false
                required: [status, level, branch, rarity]
                properties:
                  status: {type: string, enum: [OWNED, LOCKED, CONSUMED, REVOKED]}
                  level: {type: integer, minimum: 1, maximum: 6}
                  branch: {type: string, enum: [BLUE, RED]}
                  rarity: {type: string, enum: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY]}
    FaceSelection:
      type: object
      minProperties: 52
      maxProperties: 52
      description: Exactly the 52 canonical rank-suit keys; strict Zod validation rejects other keys; server validation rejects repeated instance IDs.
      additionalProperties: {type: string, format: uuid}
    LoadoutCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey, faceToInstanceIds]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        idempotencyKey: {type: string, pattern: '^[A-Za-z0-9_-]{10,128}$'}
        faceToInstanceIds: {$ref: '#/components/schemas/FaceSelection'}
    LoadoutSaved:
      type: object
      additionalProperties: false
      required: [id, version, faceToInstanceIds]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        faceToInstanceIds: {$ref: '#/components/schemas/FaceSelection'}
    CurrentLoadout:
      type: object
      additionalProperties: false
      required: [loadout]
      properties:
        loadout:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, version, faceToInstanceIds, validation]
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, minimum: 1}
            faceToInstanceIds: {$ref: '#/components/schemas/FaceSelection'}
            validation:
              type: object
              additionalProperties: false
              required: [valid, issues]
              properties:
                valid: {type: boolean}
                issues:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [code]
                    properties:
                      code: {type: string, enum: [FACE_SET, DUPLICATE_INSTANCE, CARD_UNAVAILABLE, FACE_MISMATCH]}
                      faceId: {type: string}
    ManagerSlot:
      type: object
      additionalProperties: false
      required: [slot, instanceId]
      properties:
        slot: {type: integer, minimum: 1, maximum: 100}
        instanceId: {type: string, format: uuid}
    ManagerCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey, slots]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        idempotencyKey: {type: string, pattern: '^[A-Za-z0-9_-]{10,128}$'}
        slots:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ManagerSlot'}
    ManagerSaved:
      type: object
      additionalProperties: false
      required: [version, slots]
      properties:
        version: {type: integer, minimum: 1}
        slots:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ManagerSlot'}
    ManagerView:
      type: object
      additionalProperties: false
      required: [version, maxSlots, activeInventoryCount, unmanagedCount, slots]
      properties:
        version: {type: integer, minimum: 0}
        maxSlots: {type: integer, enum: [100]}
        activeInventoryCount: {type: integer, minimum: 0}
        unmanagedCount: {type: integer, minimum: 0}
        slots:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [slot, instanceId, status, active]
            properties:
              slot: {type: integer, minimum: 1, maximum: 100}
              instanceId: {type: string, format: uuid}
              status: {type: string, enum: [OWNED, LOCKED, CONSUMED, REVOKED]}
              active: {type: boolean}
    EmptyCommand:
      type: object
      additionalProperties: false
    Profile:
      type: object
      additionalProperties: false
      required: [userId, isGuest, role]
      properties:
        userId: {type: string, format: uuid}
        isGuest: {type: boolean}
        role: {type: string, enum: [PLAYER, ADMIN]}
    GuestLink:
      type: object
      additionalProperties: false
      required: [expectedUserId, idempotencyKey]
      properties:
        expectedUserId: {type: string, format: uuid}
